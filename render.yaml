# Render blueprint — deploys DuoGrow as a single free web service.
# The Hono server serves both the API and the built React SPA from one origin,
# so no separate static host and no CORS are needed.
#
# One-time setup: render.com -> New -> Blueprint -> connect this repo -> Apply.
# Every push to the default branch auto-redeploys (and re-seeds the demo).
services:
  - type: web
    name: duogrow
    runtime: node
    plan: free
    # --include=dev is REQUIRED: Render sets NODE_ENV=production, which makes
    # `npm install` skip devDependencies (vite, typescript, @types). Without it
    # the web build fails with "vite: command not found".
    buildCommand: npm install --include=dev && npm --prefix server install --include=dev && npm --prefix web install --include=dev && npm --prefix web run build && bash scripts/litestream/install.sh
    # Boot sequence lives in a script because it has real branching: restore from
    # R2, seed only if the database is genuinely empty, then run the server under
    # Litestream so writes keep replicating.
    #
    # This is what makes the free tier durable. The instance filesystem is
    # ephemeral (no `disk:` below), so the database is gone after every deploy,
    # restart, or wake-from-sleep; Litestream restores it from R2 on boot. The
    # seed:if-empty guard means a restored database is never overwritten.
    #
    # Without the R2 variables set the script degrades to the old ephemeral
    # behaviour and says so loudly in the log, so this stays deployable before
    # the bucket exists.
    startCommand: bash scripts/litestream/start.sh
    healthCheckPath: /api/health
    envVars:
      # Pin >=22.9 so Node's --env-file-if-exists flag is recognized.
      - key: NODE_VERSION
        value: 22.18.0
      # Explicit so litestream.yml and server/src/db.ts cannot disagree about
      # where the database lives — they both derive it from DATA_DIR.
      - key: DATA_DIR
        value: /tmp/duogrow
      # R2 credentials for Litestream. Set these in the Render dashboard, never
      # here: a value committed to a blueprint is a published secret.
      #   R2_BUCKET            e.g. duogrow
      #   R2_ENDPOINT          https://<account-id>.r2.cloudflarestorage.com
      #   R2_ACCESS_KEY_ID     from an R2 API token (Object Read & Write)
      #   R2_SECRET_ACCESS_KEY shown once when the token is created
      # Until all four are present the service runs without persistence and logs
      # that it is doing so.
      #
      # Deliberately NOT set here:
      #   PORT     — Render injects it automatically; the server reads it.
      #   API_PORT — would override Render's PORT and break the health check.
      #   ANTHROPIC_API_KEY — leave unset to run the deterministic demo verifier.
      #                       Add it in the Render dashboard to enable live AI.
